# OrbStack:  HOST_PORT=5010 docker compose up --build -d   ->  http://127.0.0.1:5010
# The server binds 0.0.0.0 INSIDE the container (AREG_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 5010-5049.
name: agent-registry-demo

services:
  agent-registry-demo:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-5010}:5010"
    environment:
      PORT: "5010"
      AREG_BIND: 0.0.0.0
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5010/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
